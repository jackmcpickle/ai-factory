<!doctype html>
<!-- DESIGN BRIEF: An editorial field guide to agent-assisted delivery. Warm paper,
charcoal diagrams, vermilion human decisions, and oversized serif headlines.
Each workflow has nested, explicitly owned action boxes and a visible exit gate.
The cover's oversized loop breaks the text grid. Keyboard slides, contents,
speaker notes, responsive reading, and printable handout work without dependencies. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#efeee8" />
    <title>Human direction. Agent execution. | Applied AI delivery</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="slides.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <header class="toolbar">
      <a class="brand" href="#1">FIELD GUIDE <span>/ APPLIED AI</span></a>
      <nav aria-label="Presentation controls">
        <button id="contents" aria-expanded="false" aria-controls="toc">
          Contents</button
        ><button id="notes-toggle" aria-pressed="false">Notes</button
        ><button id="print">Print</button
        ><button id="fullscreen">Full screen</button>
      </nav>
    </header>
    <main id="deck" aria-label="Presentation slides"></main>
    <aside id="toc" aria-label="Slide contents" hidden></aside>
    <aside id="notes" aria-label="Speaker notes" hidden></aside>
    <footer class="controls">
      <span id="section-name"></span>
      <div>
        <button id="prev" aria-label="Previous slide">←</button
        ><span id="counter" aria-live="polite"></span
        ><button id="next" aria-label="Next slide">→</button>
      </div>
      <span class="hint">← → navigate · N notes · C contents</span>
    </footer>
    <div class="progress" aria-hidden="true">
      <div id="progress-fill"></div>
    </div>
    <noscript>This slide deck needs JavaScript. Enable it and reload.</noscript>
  </body>
</html>
